name: Build Chlorine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft-version: '26.2'
            gradle-version: '9.5.1'
          - minecraft-version: '26.3'
            gradle-version: '9.7.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: Build
        run: gradle build --stacktrace
        working-directory: ${{ matrix.minecraft-version }}

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chlorine-${{ matrix.minecraft-version }}-jars
          path: ${{ matrix.minecraft-version }}/build/libs/*.jar
          if-no-files-found: warn
